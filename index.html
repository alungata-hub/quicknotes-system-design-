
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QuickNotes - A simple online note-taking application.">

    <title>QuickNotes</title>

    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Your simple online note-taking space.</p>
    </header>

    <main>
        <section aria-labelledby="notes-heading">
            <h2 id="notes-heading">My Notes</h2>

            <button id="load-btn" type="button">
                Load notes
            </button>

            <p id="status" role="status" aria-live="polite">
                Click "Load notes" to retrieve your notes.
            </p>

            <ul id="notes-list"></ul>
        </section>

        <section aria-labelledby="create-heading">
            <h2 id="create-heading">Create a Note</h2>

            <form id="note-form">
                <div>
                    <label for="title-input">Note title</label>
                    <input
                        type="text"
                        id="title-input"
                        name="title"
                        maxlength="100"
                        required
                    >
                </div>

                <div>
                    <label for="body-input">Note content</label>
                    <textarea
                        id="body-input"
                        name="body"
                        rows="5"
                    ></textarea>
                </div>

                <button id="submit-btn" type="submit">
                    Create note
                </button>
            </form>
        </section>
    </main>
</body>
</html>
